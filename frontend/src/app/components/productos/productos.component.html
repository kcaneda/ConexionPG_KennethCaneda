<h1>Lista de productos: </h1>
<table>
    <thead>
        <tr>
            <th>ID: </th>
            <th>Nombre: </th>
            <th>Precio: </th>
            <th>Stock: </th>
        </tr>
    </thead>
    <tbody>
        <tr *ngFor="let p of productos">
            <td>{{p.id}}</td>
            <td>{{p.nombre}}</td>
            <td>{{p.precio}}</td>
            <td>{{p.stock}}</td>
        </tr>
    </tbody>
</table>
